<h1>Entrar</h1>

<form [formGroup]="form" (ngSubmit)="entrar()" novalidate class="form-login">
  <label>
    E-mail
    <input type="email" formControlName="email" autocomplete="username" />
  </label>
  @if (form.controls.email.touched && form.controls.email.errors) {
    <small class="erro">
      @if (form.controls.email.errors['required']) { Informe o e-mail. }
      @else { Informe um e-mail válido. }
    </small>
  }

  <label>
    Senha
    <input type="password" formControlName="senha" autocomplete="current-password" />
  </label>
  @if (form.controls.senha.touched && form.controls.senha.errors) {
    <small class="erro">Informe a senha.</small>
  }

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }

  <button type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Entrando...' : 'Entrar' }}
  </button>
</form>
