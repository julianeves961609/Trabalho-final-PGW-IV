<header class="menu">
  <a routerLink="/">Vitrine</a>

  @if (!auth.logado()) {
    <a routerLink="/login">Entrar</a>
  } @else {
    @if (auth.tipo() === 'ADMIN') {
      <a routerLink="/admin">Painel</a>
    } @else {
      <a routerLink="/cliente">Minha área</a>
    }
    <button type="button" (click)="sair()">Sair</button>
  }
</header>

<main class="conteudo">
  <router-outlet />
</main>
