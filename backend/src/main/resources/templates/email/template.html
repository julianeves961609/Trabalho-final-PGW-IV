<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div>
        <h2>
            Olá, <span th:text="${nome}">Usuário</span>!
        </h2>

        <p>Seu cadastro foi realizado com sucesso.</p>

        <p>Seus itens:</p>
        <ul>
            <li th:each="item : ${itens}" th:text="${item}">Item</li>
        </ul>

        <a th:href="${link}">Teste de link</a>
    </div>
</body>
</html>
